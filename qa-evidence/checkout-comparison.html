<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comparação visual — checkout</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: #f5f7f8; background: #16191c; font-family: Arial, sans-serif; }
      main { width: min(100%, 920px); margin: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-size: 14px; font-weight: 700; }
      img { display: block; width: 100%; height: auto; border: 1px solid #3c4247; background: #080a0c; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Referência aprovada</figcaption>
        <img src="./checkout-option2-reference.png" alt="Referência aprovada" />
      </figure>
      <figure>
        <figcaption>Implementação</figcaption>
        <img src="./checkout-option2-mobile.png" alt="Implementação mobile" />
      </figure>
    </main>
  </body>
</html>
