server {
    listen 80;
    listen [::]:80;
    server_name camisariamendes.com.br www.camisariamendes.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name camisariamendes.com.br www.camisariamendes.com.br;

    ssl_certificate /etc/letsencrypt/live/camisariamendes.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/camisariamendes.com.br/privkey.pem;

    root /var/www/camisaria/current/dist;
    index index.html;
    client_max_body_size 3m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
